[project]
name = "cloudnova-track-b"
version = "0.1.0"
description = "Spec-driven CloudNova invoice pipeline and metric query agent"
requires-python = ">=3.13,<3.15"
dependencies = ["duckdb>=1.4,<2", "anthropic>=0.70,<1", "PyYAML>=6,<7"]

[dependency-groups]
dev = ["ruff>=0.14,<1", "mypy>=1.18,<2", "pytest>=8.4,<10", "types-PyYAML>=6,<7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["app", "tests", "evals", "scripts/profile_data.py"]

[[tool.mypy.overrides]]
module = "duckdb"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
